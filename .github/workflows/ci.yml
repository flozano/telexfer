name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build and test
            cflags: -O2 -g
            ldflags: ""
          - name: ASan + UBSan
            cflags: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
            ldflags: -fsanitize=address,undefined
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark and netcat
        run: |
          # tshark decodes every test capture as an independent check
          echo "wireshark-common wireshark-common/install-setuid boolean false" |
            sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark netcat-openbsd
          tshark --version | head -1

      - name: Build
        run: make CFLAGS="${{ matrix.cflags }}" LDFLAGS="${{ matrix.ldflags }}"

      - name: Test
        # on failure the suite keeps its work directory (pcaps, logs) there
        run: TMPDIR="$RUNNER_TEMP" ./tests/run.sh

      - name: Keep test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ftamtest.*
          if-no-files-found: ignore

  isode-interop:
    name: ISODE interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" |
            sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Build
        run: make

      - name: Build ISODE (FTAM responder from source)
        run: docker build -t telexfer-isode interop/isode

      - name: Test against ISODE
        # on failure the script keeps its work directory (pcaps, logs) there
        run: TMPDIR="$RUNNER_TEMP" ./tests/isode-interop.sh

      - name: Keep test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isode-interop-artifacts
          path: ${{ runner.temp }}/isodetest.*
          if-no-files-found: ignore

  kernel-x25:
    name: Linux kernel X.25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kernel X.25 modules and tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" |
            sudo debconf-set-selections
          sudo apt-get update
          # lapbether (LAPB over Ethernet) is in linux-modules-extra
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark \
            "linux-modules-extra-$(uname -r)" || true
          uname -r
          sudo modprobe -v x25 lapb lapbether && lsmod | grep -E 'x25|lapb'

      - name: Build
        run: make all x25route

      - name: FTAM over kernel X.25 (LAPB over Ethernet on a veth pair)
        run: sudo TMPDIR="$RUNNER_TEMP" ./tests/kernel-x25.sh

      - name: Keep test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x25-artifacts
          path: ${{ runner.temp }}/kx25test.*
          if-no-files-found: ignore
